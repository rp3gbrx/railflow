[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "railflow"
version = "0.1.0"
description = "GB rail trip distribution and network flow model (ORR station usage, region-level deterrence functions, OSM network assignment)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "geopandas>=0.14", "shapely>=2.0", "pyogrio>=0.7",
  "pyarrow>=14", "numba>=0.59", "statsmodels>=0.14", "matplotlib>=3.8", "odfpy>=1.4", "openpyxl>=3.1",
]

[project.optional-dependencies]
docs = ["beautifulsoup4>=4.12", "lxml>=5", "requests>=2.31"]
dev = ["pytest>=8"]

[project.scripts]
railflow = "railflow.cli:main"

[tool.setuptools]
packages = ["railflow"]
